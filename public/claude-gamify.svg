<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Claude Gamify celebration placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="logoGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#d97757" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <!-- one firework burst, colored via currentColor on each <use> -->
    <g id="firework">
      <line x1="0" y1="0" x2="46" y2="0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="39.8" y2="23" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="23" y2="39.8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="46" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-23" y2="39.8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-39.8" y2="23" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-46" y2="0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-39.8" y2="-23" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-23" y2="-39.8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="-46" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="23" y2="-39.8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="39.8" y2="-23" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <circle cx="46" cy="0" r="3.5" fill="currentColor"/>
      <circle cx="39.8" cy="23" r="3.5" fill="currentColor"/>
      <circle cx="23" cy="39.8" r="3.5" fill="currentColor"/>
      <circle cx="0" cy="46" r="3.5" fill="currentColor"/>
      <circle cx="-23" cy="39.8" r="3.5" fill="currentColor"/>
      <circle cx="-39.8" cy="23" r="3.5" fill="currentColor"/>
      <circle cx="-46" cy="0" r="3.5" fill="currentColor"/>
      <circle cx="-39.8" cy="-23" r="3.5" fill="currentColor"/>
      <circle cx="-23" cy="-39.8" r="3.5" fill="currentColor"/>
      <circle cx="0" cy="-46" r="3.5" fill="currentColor"/>
      <circle cx="23" cy="-39.8" r="3.5" fill="currentColor"/>
      <circle cx="39.8" cy="-23" r="3.5" fill="currentColor"/>
      <circle cx="0" cy="0" r="5" fill="currentColor"/>
    </g>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- fireworks -->
  <use href="#firework" transform="translate(230,150)" style="color:#facc15"/>
  <use href="#firework" transform="translate(970,140)" style="color:#22d3ee"/>
  <use href="#firework" transform="translate(250,470)" style="color:#f472b6"/>
  <use href="#firework" transform="translate(950,470)" style="color:#4ade80"/>

  <!-- emojis -->
  <g font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" text-anchor="middle">
    <text x="110" y="95" font-size="52">🎉</text>
    <text x="1085" y="108" font-size="54">🎆</text>
    <text x="85" y="320" font-size="40">✨</text>
    <text x="1115" y="332" font-size="46">🎊</text>
    <text x="150" y="548" font-size="48">🚀</text>
    <text x="1078" y="548" font-size="38">⭐</text>
    <text x="600" y="96" font-size="46">💥</text>
    <text x="600" y="548" font-size="46">🎇</text>
  </g>

  <!-- Claude starburst logo (centered) -->
  <ellipse cx="600" cy="270" rx="230" ry="200" fill="url(#logoGlow)"/>
  <g stroke="#d97757" stroke-width="14" stroke-linecap="round">
    <line x1="600" y1="270" x2="710" y2="270"/>
    <line x1="600" y1="270" x2="657" y2="303"/>
    <line x1="600" y1="270" x2="652" y2="360"/>
    <line x1="600" y1="270" x2="600" y2="347"/>
    <line x1="600" y1="270" x2="545" y2="365"/>
    <line x1="600" y1="270" x2="548" y2="300"/>
    <line x1="600" y1="270" x2="495" y2="270"/>
    <line x1="600" y1="270" x2="538" y2="234"/>
    <line x1="600" y1="270" x2="545" y2="175"/>
    <line x1="600" y1="270" x2="600" y2="204"/>
    <line x1="600" y1="270" x2="649" y2="184"/>
    <line x1="600" y1="270" x2="662" y2="234"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="455" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="50" font-weight="700" fill="#f1f5f9" letter-spacing="-1">claude-gamify</text>
</svg>
